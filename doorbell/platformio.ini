; Anti-Rage Doorbell — prototype 1.  Two ESP32-C6 boards, brought up one step
; at a time.  Read README.md alongside this file: every env below is one step,
; and each step ends with something you can see or hear.
;
; ---------------------------------------------------------------------------
;  TOOLCHAIN — this is pioarduino, NOT the official platform-espressif32.
; ---------------------------------------------------------------------------
;  The official PlatformIO platform does not build Arduino for this chip: its
;  board manifest for esp32-c6-devkitc-1 reads
;
;      "frameworks": ["espidf"]        <- no Arduino for the C6, at all
;
;  which is why `pio project init` hands you framework = espidf.  pioarduino is
;  the community fork that carries on where the official one stopped: release
;  55.03.311 is "Arduino Release v3.3.11 based on ESP-IDF v5.5.5" and its
;  esp32-c6-devkitc-1 manifest declares ["arduino", "espidf"].
;
;  This is PLAN_v2.md §4.2 ("the toolchain migration is the first task") —
;  except the migration is a change of PLATFORM, not a version bump.
;
;  The full URL below is deliberate, not decoration.  Installing pioarduino
;  claims the bare name `espressif32` in ~/.platformio/platforms, so a project
;  that just says `platform = espressif32` silently gets whichever version is
;  newest.  Pinning the URL means THIS project always builds against 55.03.311
;  no matter what else gets installed later.

; ---------------------------------------------------------------------------
;  WINDOWS MAX_PATH — why the packages do not live in ~/.platformio.
; ---------------------------------------------------------------------------
;  esp32-arduino-libs ships the ESP-Matter headers, and connectedhomeip nests
;  them absurdly deep.  The worst entry in the tarball is 203 characters:
;
;      esp32-arduino-libs/esp32c6/include/espressif__esp_matter/
;        connectedhomeip/connectedhomeip/src/app/clusters/
;        camera-av-settings-user-level-management-server/<same-name>.h
;
;  PlatformIO stages a download in <core_dir>/.cache/tmp/pkg-installing-XXXXXXXX
;  before moving it into place.  With the default core_dir that staging prefix
;  is 62 chars, so 62 + 203 = 265 > 260, and the install dies mid-unpack with
;  a FileNotFoundError that looks like a PlatformIO bug but is really MAX_PATH.
;
;  C:\pio cuts the prefix to 42 (staging 245) and 50 (final 234).  That margin
;  matters twice over: riscv32-esp-elf-gcc is a MinGW build and is NOT
;  long-path aware, so it would still trip near the limit even on a machine
;  with LongPathsEnabled=1.  Keeping the tree short fixes the compile too.
;
;  Nothing else moves: PlatformIO Core itself stays in ~/.platformio/penv.

[platformio]
default_envs = step0_hello
core_dir = C:\pio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Serial = the chip's own USB-Serial-JTAG -> the USB-C port silkscreened
    ; "USB".  Plug into that one: it flashes AND carries the console, so one
    ; cable does everything.
    ;
    ; Why not the "UART" port, which is what a C6 tutorial will tell you?  That
    ; port goes through a CP2102N bridge, and Windows ships no driver for it --
    ; the chip enumerates but sits at ConfigManagerErrorCode 28 ("drivers not
    ; installed") and no COM port is ever created.  Installing Silicon Labs'
    ; VCP package fixes it, but the "USB" port needs no driver at all.
    ;
    ; BOTH lines are required, not just the first.  The C6 has no native
    ; USB-OTG, only USB-Serial-JTAG, so with MODE=0 the core resolves Serial to
    ; USBSerial -- which does not exist on this chip and fails to compile.
    ; MODE=1 resolves it to HWCDCSerial, which does.
    ;
    ; The two ports are independent: flash over one while monitoring the other
    ; and you get a board that runs perfectly and prints nothing at all.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall

; ===========================================================================
;  STEP 0 — does anything work at all?   1 board, 1 USB cable, no wiring.
;  Prints chip identity + the MAC you will need in step 3.
; ===========================================================================
[env:step0_hello]
build_src_filter = +<step0_hello/>

; ===========================================================================
;  BUZZER BENCH TEST — Arduino Nano ESP32, not a C6.  A spare board used to
;  decide whether a silent buzzer is the element or the C6 driving it.
;
;  This env deliberately does NOT inherit ${env.build_flags}.  Those flags are
;  C6-specific: ARDUINO_USB_MODE=1 selects hardware CDC, which is right for the
;  C6's USB-Serial-JTAG and wrong for the Nano, whose native USB is TinyUSB and
;  needs MODE=0.  The board manifest already sets ARDUINO_USB_CDC_ON_BOOT=1.
; ===========================================================================
[env:buzzer_nano]
board = arduino_nano_esp32
build_src_filter = +<buzzer_nano/>
build_flags = -Wall

; ===========================================================================
;  STEP IO — the panel's buttons and buzzer.  Board A only, no link involved.
;  Out of numeric order on purpose: it needs the panel wired, which happened
;  after steps 0-3 had already passed.
; ===========================================================================
[env:step_io]
build_src_filter = +<step_io/>

; ===========================================================================
;  STEP 1 — the wire.  2 jumpers between the boards. DoorbellMsg, 1/second.
;  Flash _tx to board A and _rx to board B.
; ===========================================================================
[env:step1_ping_tx]
build_src_filter = +<step1_ping_tx/>
build_flags = ${env.build_flags} -DLINK_SERIAL

[env:step1_ping_rx]
build_src_filter = +<step1_ping_rx/>
build_flags = ${env.build_flags} -DLINK_SERIAL

; ===========================================================================
;  STEP 2 — voice-rate traffic over that same wire.  Synthetic 440 Hz source
;  at the real 8 kHz / 13.75 ms cadence.  Same wiring as step 1.
; ===========================================================================
[env:voice_tx_uart]
build_src_filter = +<voice_tx/>
build_flags = ${env.build_flags} -DLINK_SERIAL

[env:voice_rx_uart]
build_src_filter = +<voice_rx/>
build_flags = ${env.build_flags} -DLINK_SERIAL

; ===========================================================================
;  STEP 3 — the SAME two sketches over the radio.  Unplug the jumpers.
;  Only the -D changes: that is the §4.3 seam earning its keep.
;  Set LINK_PEER_MAC_INIT in include/config_v1.h first (step 0 prints it).
; ===========================================================================
[env:voice_tx_espnow]
build_src_filter = +<voice_tx/>
build_flags = ${env.build_flags} -DLINK_ESPNOW

[env:voice_rx_espnow]
build_src_filter = +<voice_rx/>
build_flags = ${env.build_flags} -DLINK_ESPNOW

; ===========================================================================
;  STEP 5 — the speaker.  Board B only; the MAX98357A on IO10/11/4 + SD on IO3.
;
;  5a, step_amp: the amp with no link behind it, a locally generated 440 Hz
;  tone cycling on and off.  Run this FIRST.  It is the only thing that tells
;  a dead amp apart from a broken audio path, and the buzzer already showed
;  what it costs to not have that answer.
;
;  5b, voice_rx_chime: step 3's receiver, unchanged, plus -DCHIME_AUDIO.  The
;  sender side is voice_tx_espnow exactly as step 3 flashed it — board A needs
;  no reflash, so the counters stay comparable to the step 3 baseline.
; ===========================================================================
; ===========================================================================
;  STEP PANEL — the A -> C link, three wires, and the buzzer on the far end.
;
;    A IO0   ──> C D2 (GPIO5)    message, 115200 8N1
;    A IO10  ──> C D3 (GPIO6)    wake ── 10 kΩ ── GND
;    A GND   ─── C GND
;
;  Two different boards, so two envs that share almost no build settings.  Note
;  step_panel_rx does NOT inherit ${env.build_flags}, for the same reason
;  buzzer_nano does not: those flags are C6-specific and ARDUINO_USB_MODE=1
;  selects hardware CDC, which is right for USB-Serial-JTAG and wrong for the
;  Nano's TinyUSB.  The Nano also uploads over DFU — double-tap RESET, and the
;  COM port changes when it enumerates as the bootloader.
; ===========================================================================
[env:step_panel_tx]
build_src_filter = +<step_panel_tx/>

[env:step_panel_rx]
board = arduino_nano_esp32
build_src_filter = +<step_panel_rx/>
build_flags = -Wall

[env:step_amp]
build_src_filter = +<step_amp/>

[env:voice_rx_chime]
build_src_filter = +<voice_rx/>
build_flags = ${env.build_flags} -DLINK_ESPNOW -DCHIME_AUDIO

; ===========================================================================
;  METRO_GPIO — bare-metal register exercise.  Nothing to do with the
;  doorbell: a different chip, a different vendor, a different toolchain.
;  Adafruit Metro M4 Express, ATSAMD51J19A, Cortex-M4F.
;
;  Button on D7 (PB12) lights an LED on D8 (PA21) using PORT registers only,
;  and blinks the onboard D13 (PA16) as a heartbeat: slow = running, fast =
;  running and the button reads pressed, dark = never left the bootloader.
;  See src/metro_gpio/main.c — every address in it is cited to the SAM D5x/E5x
;  data sheet (DS60001507N).
;
;  This env inherits almost nothing from [env], and every override below is
;  load-bearing:
;
;    platform   atmelsam, not the pinned pioarduino URL.  First build downloads
;               toolchain-gccarmnoneeabi (~120 MB).  Per HANDOFF's toolchain
;               trap: do not let the VSCode PlatformIO extension re-init while
;               that download is running.
;
;    framework  EMPTY, and that empty value is the entire point.  Assigning
;               nothing to it cancels the inherited `framework = arduino`, and
;               PlatformIO then builds with no framework at all: no core, no
;               startup code, no linker script.  src/metro_gpio/startup.c and
;               samd51j19a.ld supply those instead.  Delete this line and the
;               Arduino core comes back and fights our vector table.
;
;    build_flags  NOT ${env.build_flags}.  Those are ESP32-C6 USB-CDC flags and
;               mean nothing to a SAMD51.  -mcpu/-mthumb pin the architecture;
;               soft float because nothing here uses floating point and a
;               soft-float build cannot trip the FPU-disabled usage fault.
;               -ffreestanding says there is no hosted C library underneath.
;               --gc-sections keeps the image to the few hundred bytes it
;               actually is (KEEP(.vectors) in the .ld protects the table).
;
;  Flashing.  DOUBLE-TAP RESET FIRST, every time.  This is not optional here
;  and it is not the usual Arduino workflow:
;
;      This image has no USB stack.  While it runs, the board enumerates
;      NOTHING — no COM port exists.  The 1200 bps open/close that normally
;      drops a board into its bootloader is a convention implemented BY THE
;      RUNNING SKETCH, not by the hardware, so there is nothing here to
;      implement it.  Leave PlatformIO to its defaults and it performs the
;      touch on a stale port, then blocks forever on "Waiting for the new
;      upload port..." for a port that can never appear.
;
;      Hence the two board_upload overrides below.  With those, the sequence
;      is: double-tap RESET (the LED fades and a COM port appears), then
;
;        pio run -e metro_gpio -t upload
;
;      One tap is a plain reset and just reruns the program; the second tap
;      inside the window is what holds the bootloader resident.
;
;      The upload itself is safe on the bootloader.  offset_address 0x4000
;      plus build.core "adafruit" makes the builder emit `bossac --offset
;      0x4000` with NO --erase (builder/main.py, the samd51 branch), so the
;      write lands above the bootloader instead of through it.
;
;  If PlatformIO's port detection gets confused anyway, bossac direct is the
;  same command without the auto-detect, and `-i` alone is a harmless probe
;  that prints the chip identity iff the board really is in the bootloader:
;
;    C:\pio\packages\tool-bossac\bossac.exe -p COM12 -i
;    C:\pio\packages\tool-bossac\bossac.exe -p COM12 -U --offset 0x4000 \
;        -w -v -R .pio/build/metro_gpio/firmware.bin
;
;  `-o 0x4000 -r1024 readback.bin` reads flash BACK, which is the only way to
;  confirm what is actually on the chip rather than what you believe you sent.
;
;  The UF2 route still works and needs no COM port at all:
;    python tools/bin2uf2.py .pio/build/metro_gpio/firmware.bin
;      then drop the .uf2 on the METROM4BOOT drive.
;
;  Do NOT append -t monitor.  This image has no USB stack and no console —
;  it cannot print, so a monitor can only ever show an empty terminal, and
;  PlatformIO picks the wrong port for it anyway (the upload port is chosen
;  by hwid, the monitor port is not).  A blank terminal here is the expected
;  result and says nothing about whether the board is running.  D13 is the
;  console: read the blink, not the terminal.
;
;  Sanity check on a build, before ever suspecting the wiring — the image is
;  a few hundred bytes, so "Flash: 0.1%" is correct and not a truncated link:
;    arm-none-eabi-objdump -h .pio/build/metro_gpio/firmware.elf
;  .text must be at VMA 0x00004000.  Linked at 0 instead, flashing it would
;  destroy the bootloader and the board would need an SWD probe to recover.
; ===========================================================================
[env:metro_gpio]
platform = atmelsam
board = adafruit_metro_m4
framework =
build_src_filter = +<metro_gpio/>

; Both of these default to yes for this board and both are wrong for a
; firmware with no USB stack — see the flashing note above.  The touch has
; nothing to talk to, and the "new" port never arrives because the port that
; matters (the bootloader's) is already there from the double-tap.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_build.ldscript = $PROJECT_DIR/src/metro_gpio/samd51j19a.ld
build_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=soft
    -ffreestanding
    -ffunction-sections
    -fdata-sections
    -O1
    -Wall
    -Wextra
    -Wl,--gc-sections
    -Wl,-nostdlib
    -Wl,-Map,.pio/build/metro_gpio/firmware.map
