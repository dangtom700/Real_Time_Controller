; Anti-Rage Doorbell — SENDER SIDE bench rig (Arduino Mega 2560).
;
; The "door panel" role: buttons, OLED, buzzer and the anti-rage state machine,
; proven on 5 V hardware before the design is compacted onto an ESP32-S3.
; Transmitted packets are printed as '#' hex frames for Doorbell_Receiver_Side.
;
;   pio run -t upload -t monitor
;
; Shared headers (protocol.h / config_mega.h / sim_link.h / synth.h) live in
; ../Doorbell_Shared so the wire format cannot drift between the two projects.
; That folder is a single source of truth, not a copy - do not duplicate it.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -I../Doorbell_Shared
lib_deps =
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.11
