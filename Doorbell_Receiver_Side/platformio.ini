; Anti-Rage Doorbell — RECEIVER SIDE bench rig (Arduino Mega 2560).
;
; The "indoor chime" role: buzzer, 2 status LEDs, and an LM386 + 8 ohm speaker
; driven by a real 8 kHz PCM engine (Timer1 PWM carrier + Timer3 sample clock).
; That audio path is the bench stand-in for the MAX98357A I2S DAC on the final
; node, so the VoiceMsg payload is exercised for real before the radio exists.
;
;   pio run -t upload -t monitor
;
; No display library here on purpose: the Mega has 8 KB of SRAM and the audio
; ring plus the frame line-buffer already want a slice of it.
;
; Shared headers (protocol.h / config_mega.h / sim_link.h / synth.h) live in
; ../Doorbell_Shared so the wire format cannot drift between the two projects.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -I../Doorbell_Shared
