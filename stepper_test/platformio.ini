; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = step_forward

; Settings shared by every sketch below
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = arduino-libraries/Stepper@^1.1.3
monitor_speed = 115200

; One env per sketch folder in src/. Without these filters PlatformIO
; compiles every main.cpp into one firmware and the link fails on
; duplicate setup()/loop().
[env:step_forward]
build_src_filter = -<*> +<step_forward/>

[env:trial]
build_src_filter = -<*> +<trial/>

[env:speed_bench]
build_src_filter = -<*> +<speed_bench/>
